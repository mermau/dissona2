name: Build macOS

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configura (binario universale Apple Silicon + Intel)
        run: |
          cmake -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Compila VST3, AU e Standalone
        run: cmake --build build --config Release --target Dissona2_VST3 Dissona2_AU Dissona2_Standalone -j 4

      - name: Test del motore DSP
        run: |
          c++ -O2 -std=c++17 -Isrc tests/engine_test.cpp -o engine_test
          mkdir -p test-audio && ./engine_test test-audio

      - name: Firma ad-hoc
        run: |
          A=build/Dissona2_artefacts/Release
          codesign --force --deep --sign - "$A/VST3/DISSONA 2.vst3"
          codesign --force --deep --sign - "$A/AU/DISSONA 2.component"
          codesign --force --deep --sign - "$A/Standalone/DISSONA 2.app"
          codesign --verify --deep --strict "$A/Standalone/DISSONA 2.app"

      - name: Validazione Audio Unit (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Dissona2_artefacts/Release/AU/DISSONA 2.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu Dsn2 Clfx

      - name: Pacchetto
        run: |
          A=build/Dissona2_artefacts/Release
          mkdir -p dist/DISSONA-2
          cp -R "$A/VST3/DISSONA 2.vst3" "$A/AU/DISSONA 2.component" "$A/Standalone/DISSONA 2.app" dist/DISSONA-2/
          cp scripts/installa.command "dist/DISSONA-2/Installa DISSONA 2.command"
          chmod +x "dist/DISSONA-2/Installa DISSONA 2.command"
          cp README.md dist/DISSONA-2/LEGGIMI.md
          (cd dist && ditto -c -k --keepParent DISSONA-2 DISSONA-2-macOS.zip)

      - uses: actions/upload-artifact@v4
        with:
          name: DISSONA-2-macOS
          path: |
            dist/DISSONA-2-macOS.zip
            test-audio/*.wav

      - name: Release (solo sui tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/DISSONA-2-macOS.zip --title "DISSONA 2 ${GITHUB_REF_NAME}" --notes "Build macOS universale (Apple Silicon + Intel) - VST3, AU e Standalone."
